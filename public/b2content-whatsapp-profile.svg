<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo escuro com gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f18;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1419;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1024" height="1024" fill="url(#bgGradient)"/>

  <!-- Logo B2Content (bowtie/funnel) - escalado para 512x358 no centro -->
  <!-- Left filled triangle — wide on left, tip pointing right -->
  <path
    d="M320 388 L320 668 L498 528 Z"
    fill="#34d399"
    stroke="none"
  />

  <!-- Right filled triangle — wide on right, tip pointing left -->
  <path
    d="M704 388 L704 668 L526 528 Z"
    fill="#34d399"
    stroke="none"
  />

  <!-- Texto "B2Content" centralizado -->
  <!-- "b2" em verde -->
  <text x="256" y="800" font-family="Arial, sans-serif" font-size="140" font-weight="900" fill="#34d399" text-anchor="start" letter-spacing="2">b2</text>

  <!-- "content" em branco -->
  <text x="440" y="800" font-family="Arial, sans-serif" font-size="140" font-weight="900" fill="#f5f5f5" text-anchor="start" letter-spacing="2">content</text>
</svg>